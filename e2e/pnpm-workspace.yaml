# A standalone workspace: the e2e app installs Offload from the registry the way a
# site repository does, not from the monorepo's packages.
autoInstallPeers: true
strictPeerDependencies: false
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
# Offload releases are always newer than pnpm's minimum release age.
minimumReleaseAgeExclude:
  - "@adirishi/*"
