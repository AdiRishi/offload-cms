# Local npm registry for Offload releases. Run with `pnpm registry`.
# @adirishi packages are stored here; everything else is proxied from npmjs.
storage: ./.registry-storage
uplinks:
  npmjs:
    url: https://registry.npmjs.org/
packages:
  "@adirishi/*":
    access: $all
    publish: $all
    unpublish: $all
  "**":
    access: $all
    proxy: npmjs
max_body_size: 200mb
log: { type: stdout, format: pretty, level: warn }
