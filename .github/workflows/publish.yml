name: Publish

# Publishes the next release to GitHub Packages after CI passes on main, and tags the
# commit. `pnpm release publish` publishes nothing when the commit changes nothing the
# packages ship since the latest release tag.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The release tags decide the next version and whether anything changed.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          payload: "true"
      - run: pnpm release publish
        env:
          OFFLOAD_REGISTRY: https://npm.pkg.github.com
          OFFLOAD_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signed SLSA build provenance for every tarball just published. Verify one with
      # `gh attestation verify <tarball> --repo AdiRishi/offload-cms`.
      - if: hashFiles('release/dist/*.tgz') != ''
        uses: actions/attest@v4
        with:
          subject-path: release/dist/*.tgz
