name: Set up Offload
description: Node, pnpm and workspace dependencies, and optionally the patched Payload checkout.
inputs:
  payload:
    description: Also create upstream/payload and restore its Turborepo cache.
    default: "false"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - if: inputs.payload == 'true'
      run: pnpm upstream:checkout
      shell: bash
    - if: inputs.payload == 'true'
      id: pnpm-store
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      shell: bash
    # setup-node's cache is keyed on the root lockfile, so Payload's packages get their own.
    - if: inputs.payload == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-payload-${{ runner.os }}-${{ hashFiles('upstream/payload/pnpm-lock.yaml') }}
    - if: inputs.payload == 'true'
      uses: actions/cache@v6
      with:
        path: upstream/payload/.turbo/cache
        key: payload-turbo-${{ hashFiles('upstream/payload.json', 'upstream/patches/**') }}
        restore-keys: payload-turbo-
